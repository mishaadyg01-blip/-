name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download official libXray Android library
        run: |
          mkdir -p app/libs
          curl -fL https://github.com/XTLS/libXray/releases/download/v26.10.29/libxray-android.zip -o /tmp/libxray-android.zip
          unzip -l /tmp/libxray-android.zip
          unzip -j /tmp/libxray-android.zip 'libxray-android/libXray.aar' -d app/libs
          test -s app/libs/libXray.aar
          unzip -l app/libs/libXray.aar | head -40
      - name: Inspect libXray API
        run: |
          unzip -p app/libs/libXray.aar classes.jar > /tmp/libxray-classes.jar
          jar tf /tmp/libxray-classes.jar | grep -Ei 'libxray|processfinder' | head -80
          echo "=== LibXray methods ==="
          javap -classpath /tmp/libxray-classes.jar -public libXray.LibXray || true
          echo "=== ProcessFinder methods ==="
          javap -classpath /tmp/libxray-classes.jar -public libXray.ProcessFinder || true
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vegaspan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
